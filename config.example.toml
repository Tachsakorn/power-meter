# Optional. The app works these out by itself; copy this file to config.toml
# only if you want to override something.

[tariff]
# type = "tou"          # "tou" or "flat"; normally picked once inside the app
# ft = 0.1623           # pin Ft; normally follows the date and updates itself

[estimate]
# base_watts = 40.0     # everything except CPU and GPU; built from detected RAM and drives
# cpu_tdp_watts = 65    # guessed from the CPU model
# gpu_board_watts = 165 # guessed from the GPU model when its power can't be read
# adapter_efficiency = 0.88

[app]
# interval_sec = 2.0
# lhm_url = "http://localhost:8085/data.json"
# data_file = "~/power-meter-usage.json"   # default: %LOCALAPPDATA%\power-meter\usage.json
